{% extends 'base.html' %}
{% block title %}Autorët – Biblioteka Pirok{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0"><i class="bi bi-person-lines-fill me-2"></i>Autorët</h4>
  <a href="{% url 'author_add' %}" class="btn btn-primary btn-sm"><i class="bi bi-plus me-1"></i>Shto Autor</a>
</div>
<div class="card">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead><tr><th>Mbiemri</th><th>Emri</th><th>Veprimet</th></tr></thead>
      <tbody>
        {% for a in authors %}
        <tr>
          <td>{{ a.last_name }}</td>
          <td>{{ a.first_name }}</td>
          <td>
            <a href="{% url 'author_edit' a.pk %}" class="btn btn-sm btn-outline-secondary">
              <i class="bi bi-pencil"></i>
            </a>
          </td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-center text-muted py-4">Asnjë autor.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
