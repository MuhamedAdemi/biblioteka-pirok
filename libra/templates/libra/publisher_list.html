{% extends 'base.html' %}
{% block title %}Botuesit – Biblioteka Pirok{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0"><i class="bi bi-building me-2"></i>Botuesit</h4>
  <a href="{% url 'publisher_add' %}" class="btn btn-primary btn-sm"><i class="bi bi-plus me-1"></i>Shto Botues</a>
</div>
<div class="card">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead><tr><th>Emri</th><th>Qyteti</th><th>Shteti</th></tr></thead>
      <tbody>
        {% for p in publishers %}
        <tr>
          <td>{{ p.name }}</td>
          <td>{{ p.city|default:"-" }}</td>
          <td>{{ p.country|default:"-" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-center text-muted py-4">Asnjë botues.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
