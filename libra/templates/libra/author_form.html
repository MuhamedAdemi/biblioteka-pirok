{% extends 'base.html' %}
{% block title %}{{ action }} – Biblioteka Pirok{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h4 class="mb-3"><i class="bi bi-person me-2"></i>{{ action }}</h4>
    <div class="card">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">{{ form.last_name.label }} <span class="text-danger">*</span></label>
            {{ form.last_name }}
            {% if form.last_name.errors %}<div class="text-danger small">{{ form.last_name.errors }}</div>{% endif %}
          </div>
          <div class="mb-3">
            <label class="form-label">{{ form.first_name.label }}</label>
            {{ form.first_name }}
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check me-1"></i>Ruaj</button>
            <a href="{% url 'author_list' %}" class="btn btn-outline-secondary">Anulo</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
