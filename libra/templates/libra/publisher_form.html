{% extends 'base.html' %}
{% block title %}{{ action }} – Biblioteka Pirok{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h4 class="mb-3"><i class="bi bi-building me-2"></i>{{ action }}</h4>
    <div class="card">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Emri i Botuesit <span class="text-danger">*</span></label>
            {{ form.name }}
          </div>
          <div class="mb-3">
            <label class="form-label">Qyteti</label>
            {{ form.city }}
          </div>
          <div class="mb-3">
            <label class="form-label">Shteti</label>
            {{ form.country }}
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check me-1"></i>Ruaj</button>
            <a href="{% url 'publisher_list' %}" class="btn btn-outline-secondary">Anulo</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
