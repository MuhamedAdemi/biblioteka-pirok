{% extends 'base.html' %}
{% block title %}{{ action }} – Biblioteka Pirok{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'subject_list' %}">Kategoritë</a></li>
    <li class="breadcrumb-item active">{{ action }}</li>
  </ol>
</nav>

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header fw-semibold">
        <i class="bi bi-tag me-2"></i>{{ action }}
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Emri (anglisht) <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control"
                   value="{{ subject.name|default:'' }}"
                   placeholder="p.sh. Law, Economics, History..."
                   autofocus required>
            <small class="text-muted">Kategoritë regjistrohen në anglisht (standard biblioteke).</small>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check me-1"></i>Ruaj
            </button>
            <a href="{% url 'subject_list' %}" class="btn btn-outline-secondary">Anulo</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
